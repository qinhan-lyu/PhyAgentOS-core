# RoboDojo benchmark 节点配置样例。
# 用法：BENCHMARK_CONFIG=/abs/path/config.yaml ROBODOJO_ROOT=/abs/path/RoboDojo python main.py
#
# 提醒：官方协议是每任务 50 集 × 3 个种子 = 150 集。**我们跑这个节点是为了验证
# 链路正确，不是复现榜单**，所以默认集数刻意设得很小。要复现榜单再往上调。

benchmark: robodojo

# 逗号分隔的任务名，或 all。
# 公开 G05 对照任务；正式验收使用该任务的 50 个预生成布局。
suite: put_bottles_into_dustbin

env_cfg_type: arx_x5      # ARX X5 双臂，对应 env_cfg/arx_x5.yml
device_id: 0              # 进程可见的 GPU 序号（外面用 CUDA_VISIBLE_DEVICES 选卡）

init_states_per_task: 2   # 每个 task 取几个 seed。验证链路 2 个就够
num_runs: 1
seed: 0

action_type: joint        # 必须与策略 deploy.yml 一致（G05=joint，launcher 默认 ee）
policy_id: G05            # 仅用于结果标注和官方配置组装，动作实际从 dora 来
additional_info: forge

# dora 通道 → 原生相机名。原生名唯一，零歧义，别自己发明别名。
camera_map:
  image/head: cam_head
  image/left_wrist: cam_left_wrist
  image/right_wrist: cam_right_wrist

record_dir: ./forge_results/robodojo/videos
result_dir: ./forge_results/robodojo
