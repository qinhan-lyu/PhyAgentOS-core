# 两节点评测闭环：benchmark ↔ policy，无中间节点。
#
# 跑：dora run dataflow.example.yaml
#
# 两个节点**必须用不同的 python**，这不是洁癖是硬约束：
#   benchmark 侧要 isaacsim 5.1，它钉死 websockets==12.0
#   policy 侧要 xpolicylab，它要求 websockets>=14.0
# 直接冲突。官方把策略服务器和仿真客户端设计成两个 conda env 就是这个原因。
# （反过来说，我们这套 forge 架构天然避开了这个冲突：benchmark 节点根本不碰
#  websockets——WsModelClient 被 stub 掉了。）

nodes:
  - id: robodojo_benchmark
    path: <ROBODOJO_ENV>/bin/python
    args: -u main.py
    env:
      BENCHMARK_CONFIG: ./config.yaml
      ROBODOJO_ROOT: <ROBODOJO_REPO_ROOT>
      # Isaac Sim 的 iray 扩展要 libGLU.so.1，系统没有且无 sudo
      LD_LIBRARY_PATH: <ROBODOJO_ENV>/lib
      OMNI_KIT_ACCEPT_EULA: "YES"
      # **不要设 CUDA_VISIBLE_DEVICES**：Omniverse 自己枚举物理设备，
      # 和 CUDA 的枚举不是一套。选卡用 config.yaml 的 device_id。
    inputs:
      action: policy/action
    outputs:
      - proprio_state
      - image/head
      - image/left_wrist
      - image/right_wrist
      - policy_command
      - benchmark_status
      - benchmark_result

  - id: policy
    path: <ROBODOJO_POLICY_ENV>/bin/python
    args: -u policy_node.py
    env:
      XPOLICYLAB_ROOT: <ROBODOJO_REPO_ROOT>/XPolicyLab
      # G05 是 RoboDojo 官方公开 checkpoint 对照所用策略；权重和处理器
      # 均由部署环境提供，不能写入仓库。
      POLICY_NAME: G05
      ENV_CFG_TYPE: arx_x5
      ACTION_TYPE: joint
      G05_CKPT_PATH: <G05_CHECKPOINT_PATH>
      G05_PROCESSOR_PATH: <G05_PROCESSOR_PATH>
    inputs:
      tick: dora/timer/millis/20      # 只当心跳，绝不在 tick 上推理
      policy_command:
        source: robodojo_benchmark/policy_command
        # 必须显式加深：episode 边界会在这条通道上连发 set_instruction +
        # reset_scene 两条 PolicyCommand（它们不是独立通道），
        # 默认队列深度会把前一条挤掉，表现为首个 episode 拿着上一句指令跑完——
        # 照样出分，不报错。
        queue_size: 32
      proprio_state: robodojo_benchmark/proprio_state
      image/head: robodojo_benchmark/image/head
      image/left_wrist: robodojo_benchmark/image/left_wrist
      image/right_wrist: robodojo_benchmark/image/right_wrist
    outputs:
      - action
