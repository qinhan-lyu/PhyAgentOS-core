[project]
name = "forge-runtime-benchmarks-robodojo"
version = "0.1.0"
description = "RoboDojo benchmark node for Forge (Isaac Sim env, two-node topology)"
requires-python = ">=3.10"
dependencies = [
    "dora-rs==0.4.1",
    "forge-msgs",
    "numpy",
    "pyarrow",
    "pyyaml>=6.0",
    # RoboDojo 与 Isaac Sim 由评测环境提供（见 README 的环境要求），不在此声明，
    # 避免把一整套仿真依赖拖进 forge_runtime 的解析。
]

[tool.uv.sources]
forge-msgs = { git = "https://gitlab.ex-ai.cn/PhyAgentOS/framework/forge.git", subdirectory = "packages/msgs", rev = "dev" }
